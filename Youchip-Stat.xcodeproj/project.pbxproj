			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copy OpenCV libraries to app bundle\nmkdir -p \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks\"\nmkdir -p \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS\"\n\n# Copy all OpenCV dylib files to both locations\ncp \"${PROJECT_DIR}/OpenCv/\"*.dylib \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks/\"\ncp \"${PROJECT_DIR}/OpenCv/\"*.dylib \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/\"\n\n# Create a list of all OpenCV libraries for dependency resolution\nOPENCV_LIBS=(\n    \"libopencv_core.413.dylib\"\n    \"libopencv_imgproc.413.dylib\"\n    \"libopencv_imgcodecs.413.dylib\"\n    \"libopencv_videoio.413.dylib\"\n    \"libopencv_highgui.413.dylib\"\n    \"libopencv_features2d.413.dylib\"\n    \"libopencv_calib3d.413.dylib\"\n    \"libopencv_objdetect.413.dylib\"\n    \"libopencv_ml.413.dylib\"\n    \"libopencv_flann.413.dylib\"\n    \"libopencv_photo.413.dylib\"\n    \"libopencv_video.413.dylib\"\n    \"libopencv_stitching.413.dylib\"\n    \"libopencv_gapi.413.dylib\"\n    \"libopencv_dnn.413.dylib\"\n)\n\n# Fix library paths and code signing for Frameworks\nfor lib_name in \"${OPENCV_LIBS[@]}\"; do\n    lib_path=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Frameworks/$lib_name\"\n    if [ -f \"$lib_path\" ]; then\n        echo \"Processing Frameworks/$lib_name...\"\n        \n        # Remove code signature to avoid Team ID conflicts\n        codesign --remove-signature \"$lib_path\" 2>/dev/null || true\n        \n        # Set new ID using @rpath\n        install_name_tool -id \"@rpath/$lib_name\" \"$lib_path\"\n        \n        # Update dependencies to use @rpath for all OpenCV libraries\n        for dep_name in \"${OPENCV_LIBS[@]}\"; do\n            if [ \"$lib_name\" != \"$dep_name\" ]; then\n                install_name_tool -change \"$dep_name\" \"@rpath/$dep_name\" \"$lib_path\" 2>/dev/null || true\n            fi\n        done\n        \n        # Re-sign with ad-hoc signature\n        codesign --force --sign - \"$lib_path\"\n    fi\ndone\n\n# Fix library paths and code signing for MacOS\nfor lib_name in \"${OPENCV_LIBS[@]}\"; do\n    lib_path=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/MacOS/$lib_name\"\n    if [ -f \"$lib_path\" ]; then\n        echo \"Processing MacOS/$lib_name...\"\n        \n        # Remove code signature to avoid Team ID conflicts\n        codesign --remove-signature \"$lib_path\" 2>/dev/null || true\n        \n        # Set new ID using @rpath\n        install_name_tool -id \"@rpath/$lib_name\" \"$lib_path\"\n        \n        # Update dependencies to use @rpath for all OpenCV libraries\n        for dep_name in \"${OPENCV_LIBS[@]}\"; do\n            if [ \"$lib_name\" != \"$dep_name\" ]; then\n                install_name_tool -change \"$dep_name\" \"@rpath/$dep_name\" \"$lib_path\" 2>/dev/null || true\n            fi\n        done\n        \n        # Re-sign with ad-hoc signature\n        codesign --force --sign - \"$lib_path\"\n    fi\ndone\n\necho \"OpenCV libraries copied and configured successfully\"\n";
		};
